# รันชุดทดสอบอัตโนมัติ e2e/ (Playwright + Firebase Emulator) ทุกครั้งที่ push/เปิด PR
# ใช้ emulator ในเครื่อง runner เท่านั้น (project demo-callsaleng) — ไม่ต้องมี secret และไม่แตะ production
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Firestore emulator ต้องใช้ Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # เก็บไฟล์ emulator (.jar) ที่ firebase-tools ดาวน์โหลดไว้ข้ามรอบ
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js เปิด emulator ให้เอง (webServer) แล้วรันเทสต์ทั้งหมด
      - name: Run tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
