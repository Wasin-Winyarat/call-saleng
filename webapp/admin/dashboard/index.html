<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Admin Dashboard — กรีนซาเล้ง</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../admin-shell.css">
</head>
<!-- เปิดไฟล์นี้ตรงๆ (double-click) ได้เลย ไม่ต้องรัน server -->
<body>
<header class="admin-header" id="adminHeader"></header>

<div class="page">
  <div class="page-head">
    <div>
      <h1 class="page-head-title">คำขอเรียกรถซาเล้ง</h1>
      <div class="page-head-sub">อัปเดตอัตโนมัติแบบ real-time — กดที่คำขอเพื่อดูรายละเอียด ยืนยัน/ปฏิเสธ และแชทกับลูกค้า</div>
    </div>
    <div class="page-head-actions">
      <button type="button" class="btn btn-secondary" id="summarizeAllBtn">🤖 สรุปรายการด้วย AI</button>
    </div>
  </div>

  <button type="button" class="unread-summary" id="unreadSummary" hidden></button>

  <div class="chip-row" id="filterRow" role="tablist" aria-label="กรองตามสถานะ">
    <button type="button" class="chip" role="tab" data-status="pending_admin_review">รอตรวจสอบ<span class="chip-count" data-count="pending_admin_review"></span></button>
    <button type="button" class="chip" role="tab" data-status="open_for_saleng">เปิดให้สาเล้งรับงาน<span class="chip-count" data-count="open_for_saleng"></span></button>
    <button type="button" class="chip" role="tab" data-status="pending_match_confirm">รอยืนยันจับคู่<span class="chip-count" data-count="pending_match_confirm"></span></button>
    <button type="button" class="chip" role="tab" data-status="confirmed">ยืนยันแล้ว<span class="chip-count" data-count="confirmed"></span></button>
    <button type="button" class="chip" role="tab" data-status="completed">เสร็จสิ้น<span class="chip-count" data-count="completed"></span></button>
    <button type="button" class="chip" role="tab" data-status="cancelled">ยกเลิกแล้ว<span class="chip-count" data-count="cancelled"></span></button>
    <button type="button" class="chip" role="tab" data-status="">ทั้งหมด<span class="chip-count" data-count=""></span></button>
  </div>

  <div class="ai-output ai-summary-all-output" id="summarizeAllResult" hidden></div>

  <div id="requestList">
    <div class="empty-note">กำลังโหลด...</div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">ยืนยันการทำรายการ?</div>
    <div class="modal-desc" id="modalDesc"></div>
    <select class="modal-reason-dropdown" id="modalReasonDropdown" style="display:none;">
      <option value="">-- เลือกสาเหตุที่พบบ่อย (ข้อความสำเร็จรูป ไม่ใช้ AI) --</option>
      <option value="ที่อยู่นอกเขตพื้นที่ให้บริการ">ที่อยู่นอกเขตพื้นที่ให้บริการ</option>
      <option value="ติดต่อลูกค้าไม่ได้ หรือเบอร์โทรไม่ถูกต้อง">ติดต่อลูกค้าไม่ได้ / เบอร์โทรไม่ถูกต้อง</option>
      <option value="ข้อมูลคำขอไม่ครบถ้วนหรือไม่ชัดเจน">ข้อมูลคำขอไม่ครบถ้วน/ไม่ชัดเจน</option>
      <option value="ลูกค้าแจ้งขอยกเลิกเอง">ลูกค้าแจ้งขอยกเลิกเอง</option>
      <option value="คำขอนี้ซ้ำกับคำขออื่นของลูกค้าคนเดียวกัน">คำขอซ้ำกับรายการอื่น</option>
      <option value="ช่วงเวลานัดหมายไม่สามารถให้บริการได้">ช่วงเวลานัดหมายไม่สามารถให้บริการได้</option>
    </select>
    <textarea class="modal-reason" id="modalReasonInput" placeholder="เลือกจากรายการด้านบน หรือพิมพ์เหตุผลอื่นๆ เองแล้วกด '🤖 ช่วยเรียบเรียงให้สุภาพ' ด้านล่าง" style="display:none;"></textarea>
    <button class="btn btn-secondary" id="modalDraftReasonBtn" style="display:none; margin-bottom:14px;">🤖 ช่วยเรียบเรียงให้สุภาพ</button>
    <div class="modal-actions">
      <button class="btn btn-primary" id="modalConfirmBtn">ยืนยัน</button>
      <button class="btn btn-secondary" id="modalCancelBtn">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="aiSettingsModal">
  <form class="modal-box" id="aiSettingsForm" autocomplete="off">
    <div class="modal-title">⚙️ ตั้งค่า AI</div>
    <div class="modal-desc" id="aiSettingsStatus"></div>
    <label class="ai-key-label" for="aiKeyInput">OpenRouter API key</label>
    <input type="password" class="ai-key-input" id="aiKeyInput" placeholder="sk-or-v1-..." spellcheck="false">
    <div class="ai-key-help">
      ขอ key ได้ที่ <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a> (login → Create Key → คัดลอกมาวาง)<br>
      key เก็บไว้ใน browser นี้เท่านั้น ไม่ถูกส่งขึ้น Firestore หรือ GitHub
    </div>
    <div class="modal-actions">
      <button type="submit" class="btn btn-primary" id="aiKeySaveBtn">บันทึก</button>
      <button type="button" class="btn btn-danger" id="aiKeyClearBtn">ลบ key ออกจากเครื่องนี้</button>
      <button type="button" class="btn btn-secondary" id="aiKeyCancelBtn">ปิด</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-config.js"></script>
<script src="../../ai-config.js"></script>
<script src="../../ai-helpers.js"></script>
<script src="../../notify-helpers.js"></script>
<script src="../../image-helpers.js"></script>
<script src="../admin-shell.js"></script>
<script src="../../saleng-helpers.js"></script>
<script src="app.js"></script>
<script src="matching.js"></script>
</body>
</html>
