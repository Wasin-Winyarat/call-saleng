<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เข้าสู่ระบบ — กรีนซาเล้ง</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared-styles.css">
</head>
<!-- เปิดไฟล์นี้ตรงๆ (double-click) ได้เลย ไม่ต้องรัน server -->
<body>
<div class="page">
  <h1 class="h1">เข้าสู่ระบบ</h1>
  <div class="text-secondary text-center" style="margin-bottom:24px;">สำหรับลูกค้าเรียกรถซาเล้ง</div>

  <div class="card">
    <div class="banner error" id="errorBanner"></div>

    <form id="loginForm" novalidate>
      <div class="field" id="field-phone">
        <label>เบอร์โทรศัพท์ <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="08X-XXX-XXXX">
        <div class="error-text">กรุณากรอกเบอร์โทรให้ถูกต้อง</div>
      </div>

      <div class="field" id="field-password">
        <label>รหัสผ่าน <span class="req">*</span></label>
        <input type="password" id="password" placeholder="รหัสผ่าน">
        <div class="error-text">กรุณากรอกรหัสผ่าน</div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">เข้าสู่ระบบ</button>
    </form>

    <div class="link-row">ยังไม่มีบัญชี? <a href="../register/index.html">สมัครเข้าใช้งานระบบ</a></div>
  </div>

  <div class="link-row"><a href="../index.html">← กลับหน้าแรก</a></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../auth-helpers.js"></script>
<script src="app.js"></script>
</body>
</html>
