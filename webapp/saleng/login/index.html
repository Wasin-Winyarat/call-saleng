<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ซาเล้งเข้าสู่ระบบ — กรีนซาเล้ง</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared-styles.css">
<link rel="stylesheet" href="../saleng-auth.css">
</head>
<!-- เปิดไฟล์นี้ตรงๆ (double-click) ได้เลย ไม่ต้องรัน server -->
<body>
<div class="page center">
  <div class="brand" style="margin-bottom:24px;">
    <img src="../../assets/logo.png" alt="กรีนซาเล้ง" class="brand-logo-img" style="width:160px; height:160px;">
    <div><span class="role-tag">🛺 สำหรับซาเล้ง</span></div>
    <div class="name">เข้าสู่ระบบซาเล้ง</div>
  </div>

  <div class="card">
    <div class="banner error" id="errorBanner"></div>
    <form id="loginForm" novalidate>
      <div class="field" id="field-phone">
        <label for="phone">เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" placeholder="08X-XXX-XXXX" autocomplete="tel">
        <div class="error-text">กรุณากรอกเบอร์โทรให้ถูกต้อง</div>
      </div>
      <div class="field" id="field-password">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password">
        <div class="error-text">กรุณากรอกรหัสผ่าน</div>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">เข้าสู่ระบบ</button>
    </form>
    <div class="link-row">ยังไม่มีบัญชีซาเล้ง? <a href="../register/index.html">สมัครเป็นซาเล้ง</a></div>
  </div>

  <div class="link-row"><a href="../../index.html">← กลับหน้าแรก</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-config.js"></script>
<script src="../../saleng-helpers.js"></script>
<script src="app.js"></script>
</body>
</html>
