<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ทดสอบ OpenRouter AI</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 16px;
      text-align: center;
    }
    button {
      font-size: 1rem;
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      background: #2e7d32;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
    }
    #result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      background: #f1f1f1;
      min-height: 40px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>ทดสอบส่งข้อความหา AI</h1>
  <button id="sendBtn">ส่ง "สวัสดี"</button>
  <div id="result">(ยังไม่มีคำตอบ)</div>

  <script src="../ai-config.js"></script>
  <script src="../ai-helpers.js"></script>
  <script src="app.js"></script>
</body>
</html>
